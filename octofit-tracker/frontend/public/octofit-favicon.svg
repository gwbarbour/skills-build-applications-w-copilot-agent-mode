<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" fill="#667eea" rx="20"/>
  
  <!-- Octopus body -->
  <circle cx="50" cy="35" r="18" fill="white"/>
  
  <!-- Octopus eyes -->
  <circle cx="43" cy="30" r="3" fill="#667eea"/>
  <circle cx="57" cy="30" r="3" fill="#667eea"/>
  
  <!-- Octopus tentacles -->
  <path d="M 38 48 Q 35 60 37 75" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 43 50 Q 40 65 43 80" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 50 52 Q 49 67 50 82" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 57 50 Q 60 65 57 80" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 62 48 Q 65 60 63 75" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Dumbbell accent -->
  <circle cx="20" cy="15" r="3" fill="#f39c12"/>
  <rect x="23" y="14" width="6" height="2" fill="#f39c12"/>
  <circle cx="30" cy="15" r="3" fill="#f39c12"/>
</svg>